version: '3.8'

services:
  sling:
    image: apache/sling:12
    container_name: sling-oak-standalone
    ports:
      - "8080:8080"
    environment:
      - SLING_OPTS=-Dsling.run.modes=oak_tar
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/system/console/status-productinfo.json", "-u", "admin:admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sling-querybuilder-gateway
    ports:
      - "8081:8081"
    command: ["sling-querybuilder", "gateway", "--sling-url", "http://sling:8080", "--host", "0.0.0.0", "--port", "8081"]
    depends_on:
      - sling
    restart: unless-stopped
