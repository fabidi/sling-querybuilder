[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sling-querybuilder"
version = "0.1.0"
description = "Open-source QueryBuilder to JCR-SQL2 compiler and runtime gateway for Apache Sling and Jackrabbit Oak"
readme = "README.md"
authors = [
    { name = "Faisal Abidi" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["aem", "apache-sling", "jackrabbit-oak", "jcr", "querybuilder", "sql2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/fabidi/sling-querybuilder"
Repository = "https://github.com/fabidi/sling-querybuilder.git"
Issues = "https://github.com/fabidi/sling-querybuilder/issues"

[project.scripts]
sling-querybuilder = "sling_querybuilder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sling_querybuilder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
